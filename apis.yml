name: Plink
description: Plink is a personalized commerce and card-linking platform that turns
  everyday payment transactions into intelligent, permission-based savings and engagement
  experiences for banks, merchants, and consumers. Its technology enriches transactions
  in real time, applying business rules and automated actions across payments, digital
  banking, and customer engagement, and exposes an API that lets any payment network
  make its transactions "smart" while keeping consumers anonymous. Plink says it has
  personalized over 700 million transactions and reaches 350+ banks, hundreds of thousands
  of merchants, and 10+ million consumers through an invitation-only network. The
  company operates a merchant/business portal and a consumer savings program (Fancoins)
  built on a PCI-compliant, tokenized card-linking structure.
